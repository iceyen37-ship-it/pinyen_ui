name: Build Android app

on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWALLOWCARE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "SWALLOWCARE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key secret set - the .aab will be unsigned and cannot be uploaded to Google Play."
          fi

      - name: Build test APK and Play Store bundle
        env:
          SWALLOWCARE_KEYSTORE_PASSWORD: ${{ secrets.SWALLOWCARE_KEYSTORE_PASSWORD }}
          SWALLOWCARE_KEY_ALIAS: ${{ secrets.SWALLOWCARE_KEY_ALIAS }}
          SWALLOWCARE_KEY_PASSWORD: ${{ secrets.SWALLOWCARE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SwallowCare-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SwallowCare-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
